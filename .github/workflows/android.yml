name: Build Release APK

on:
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1

    - name: set up JDK 21
      uses: actions/setup-java@v6.1.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4.0.4

    - uses: gradle/actions/setup-gradle@v6.4.0

    - uses: astral-sh/setup-uv@v10.3.0

    - run: uv run --no-project --python 3.14 python -m unittest discover -s scripts -p 'test_*.py'

    - run: ./gradlew :app:assembleRelease :app:writeWebp16kReference --no-daemon --max-workers=2

    - name: Test native overlay integrity guards
      run: ./gradlew -p buildSrc test --no-daemon --max-workers=2

    - name: Verify packaged native libraries before signing
      run: uv run --no-project --python 3.14 python scripts/verify_native_payloads.py

    - name: Gather every flavor and ABI release
      run: uv run --no-project --python 3.14 python scripts/release_artifacts.py prepare

    - name: Sign app APK
      id: sign_app
      uses: ilharp/sign-android-release@758313793d0a2cf83cb215c5006100079d79c3f0 # nightly, reviewed recursive glob and -signed.apk output
      with:
        releaseDir: .release/unsigned
        buildToolsVersion: '37.0.0'
        signingKey: ${{ secrets.SIGNING_KEY }}
        keyAlias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    - name: Verify every signed APK before upload
      env:
        SIGNED_FILES: ${{ steps.sign_app.outputs.signedFiles }}
      run: >-
        uv run --no-project --python 3.14 python scripts/release_artifacts.py verify
        --signed-files "$SIGNED_FILES"
        --apksigner "$ANDROID_HOME/build-tools/37.0.0/apksigner"

    - name: Upload Artifact
      uses: actions/upload-artifact@v7.0.2
      with:
        name: signed-apks
        path: .release/verified/*-signed.apk
        if-no-files-found: error
        retention-days: 20

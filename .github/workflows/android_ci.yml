name: Android CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4

      - uses: gradle/actions/setup-gradle@v6.4.0
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Test release artifact staging without signing
        run: uv run --no-project --python 3.14 python -m unittest discover -s scripts -p 'test_*.py'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew :app:testGenericDebugUnitTest :app:lintGenericDebug :app:assembleGenericRelease --no-daemon --max-workers=2
